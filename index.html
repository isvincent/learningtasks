</style></head><body><div class="wrap"><header class="hero"><div><span class="eyebrow">高中跨域探究 · 議題資料庫</span><h1>50 個議題，找到你的探究起點</h1><p>從校園、數位、環境到社會生活。搜尋關鍵字、依主題篩選，再把議題與學習歷程一鍵複製到教案、學習單或 AI 提示詞。</p></div><div class="hero-art" aria-hidden="true"><i style="--c:#2774df;--d:0"></i><i style="--c:#16a9a6;--d:1"></i><i style="--c:#f7b05b;--d:2"></i><i style="--c:#8666d6;--d:3"></i><i style="--c:#32bb84;--d:4"></i><i style="--c:#2774df;--d:5"></i><i style="--c:#16a9a6;--d:6"></i><i style="--c:#f7b05b;--d:7"></i><i style="--c:#8666d6;--d:8"></i><i style="--c:#32bb84;--d:9"></i><i style="--c:#2774df;--d:10"></i><i style="--c:#16a9a6;--d:11"></i><i style="--c:#f7b05b;--d:12"></i><i style="--c:#8666d6;--d:13"></i><i style="--c:#32bb84;--d:14"></i></div></header><div class="summary"><div class="stat"><b>50</b> 個議題</div><div class="stat"><b>8</b> 個分類</div><div class="stat"><b>1</b> 頁離線使用</div></div><section class="toolbar" aria-label="搜尋與複製"><div class="control"><label for="search">搜尋議題、歷程、成果或編號</label><input id="search" type="search" placeholder="例如：AI、圖書館、回饋、42" autocomplete="off"></div><div class="control"><label for="sort">排序</label><select id="sort"><option value="asc">編號 1 → 50</option><option value="desc">編號 50 → 1</option><option value="title">依議題名稱</option></select></div><div class="actions"><button class="btn primary" id="copyVisible" type="button">複製目前結果</button><button class="btn" id="clear" type="button">清除篩選</button></div></section><nav class="filters" id="filters" aria-label="議題分類"></nav><div class="result-bar"><span id="resultCount" role="status" aria-live="polite"></span><span>點選「複製歷程」或「複製完整任務」即可帶走內容</span></div><main id="list" class="grid" aria-label="議題列表"></main><p class="note">教學提醒：歷程是依各議題編排的建議順序，可視學生需求回到前一步補查證據或修訂方案。涉及規範與政策時，請於上課前查核最新官方資料。</p></div><button class="btn backtop" id="top" type="button" aria-label="回到頁首">↑ 頁首</button><div class="sr-only" id="announce" aria-live="polite"></div><script id="topics-data" type="application/json">[{"id":1,"title":"學生作業使用 (()=>{'use strict';const topics=JSON.parse(document.getElementById('topics-data').textContent);const cats=[...new Set(topics.map(x=>x.category))];const colors={'AI 與數位':'#426ed2','校園治理':'#128b91','環境與永續':'#2c9467','消費與經濟':'#cc7425','健康與生活':'#ba5d87','媒體與文化':'#805bbb','社會與共融':'#bf6962','學習與評量':'#426bb4'};let selected='全部',visible=[];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(s){return String(s).normalize('NFKC').toLocaleLowerCase('zh-TW')}function textOf(x,part='full'){const process=x.steps.join(' → ');if(part==='process')return `議題 ${x.id}｜${x.title}
學習歷程：${process}`;return `議題 ${x.id}｜${x.title}
分類：${x.category}
學習歷程：${process}
建議成果：${x.output}`}
function filters(){let items=['全部',...cats];$('#filters').innerHTML=items.map(c=>`<button type="button" class="filter" data-cat="${esc(c)}" aria-pressed="${selected===c}">${esc(c)} <small>${c==='全部'?topics.length:topics.filter(x=>x.category===c).length}</small></button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;render()})}
function render(){let q=norm($('#search').value.trim()),sort=$('#sort').value;visible=topics.filter(x=>(selected==='全部'||x.category===selected)&&(!q||norm([x.id,x.title,x.category,x.steps.join(' '),x.output].join(' ')).includes(q)));if(sort==='desc')visible.reverse();else if(sort==='title')visible.sort((a,b)=>a.title.localeCompare(b.title,'zh-TW'));filters();$('#resultCount').textContent=`顯示 ${visible.length} / 50 個議題${selected==='全部'?'':` · ${selected}`}`;$('#copyVisible').disabled=!visible.length;$('#list').innerHTML=visible.length?visible.map(x=>`<article class="card" style="--accent:${colors[x.category]}" aria-labelledby="topic-${x.id}"><div class="card-head"><span class="num">議題 ${String(x.id).padStart(2,'0')}</span><span class="pill">${esc(x.category)}</span></div><h2 id="topic-${x.id}">${esc(x.title)}</h2><div class="process" aria-label="學習歷程">${x.steps.map((s,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<span class="step">${esc(s)}</span>`).join('')}</div><div class="output"><strong>建議成果：</strong>${esc(x.output)}</div><div class="card-actions"><button type="button" class="btn small primary" data-copy="process" data-id="${x.id}" aria-label="複製議題 ${x.id} 的學習歷程">複製歷程</button><button type="button" class="btn small ghost" data-copy="full" data-id="${x.id}" aria-label="複製議題 ${x.id} 的完整任務">複製完整任務</button></div></article>`).join(''):'<div class="empty"><strong>找不到符合的議題</strong>試著換個關鍵字，或清除分類篩選。</div>';$('#list').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let x=topics.find(t=>t.id===Number(b.dataset.id));copy(textOf(x,b.dataset.copy),`已複製議題 ${x.id}${b.dataset.copy==='process'?'的歷程':'的完整任務'}`)})}
async function copy(s,message){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(s);else{let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}toast(message)}catch{toast('複製失敗，請改用選取文字複製')}}function toast(s){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);$('#announce').textContent=s;setTimeout(()=>e.remove(),2400)}$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);$('#clear').onclick=()=>{$('#search').value='';$('#sort').value='asc';selected='全部';render();$('#search').focus()};$('#copyVisible').onclick=()=>copy(visible.map(x=>textOf(x)).join('\n\n────────────────────────\n\n'),`已複製目前 ${visible.length} 個議題`);$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>$('#top').classList.toggle('show',scrollY>500),{passive:true});render();})();
</script></body></html>
